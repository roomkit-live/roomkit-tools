name: Bug report
description: A tool, the Python API or a RoomKit integration does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report security issues privately instead: see SECURITY.md.
        Never paste API keys, private conversations or provider responses.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The tool and its arguments, or the smallest program or example (for instance `python examples/roomkit_read.py`) that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0a15, or a commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system, Python and Rust versions
      placeholder: Ubuntu 24.04, CPython 3.12, Rust 1.94
    validations:
      required: true
