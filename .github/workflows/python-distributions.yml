name: Python distributions

# Build and test artifacts on demand. Publishing is a separate maintainer step.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux x86_64 distributions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: python -m pip install 'uv>=0.9,<1'
      - name: Read pinned Rust toolchain
        id: toolchain
        run: |
          python - <<'PYTHON'
          import os, pathlib, tomllib
          channel = tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"channel={channel}", file=output)
          PYTHON
      - name: Build optimized base wheel in manylinux
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: "1.16.0"
          rust-toolchain: ${{ steps.toolchain.outputs.channel }}
          manylinux: "2_34"
          container: quay.io/pypa/manylinux_2_34_x86_64@sha256:834a2a31de5eabacd4411417b3bbc9fcb6ff9f959972711ab3b73355e7b0928d
          args: --locked --release --strip --auditwheel check --interpreter python3.12 --out dist
      - name: Build optional OCR backend wheel in manylinux
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: "1.16.0"
          rust-toolchain: ${{ steps.toolchain.outputs.channel }}
          manylinux: "2_34"
          container: quay.io/pypa/manylinux_2_34_x86_64@sha256:834a2a31de5eabacd4411417b3bbc9fcb6ff9f959972711ab3b73355e7b0928d
          working-directory: backends/rusto/python
          args: --locked --release --strip --auditwheel check --interpreter python3.12 --out ../../../dist
      - name: Build both source distributions
        run: |
          uv tool run --from 'maturin==1.16.0' maturin sdist --out dist
          uv tool run --from 'maturin==1.16.0' maturin sdist --manifest-path backends/rusto/python/Cargo.toml --out dist
      - name: Check package metadata and description rendering
        run: uv tool run --from 'twine>=6,<7' twine check --strict dist/*.whl dist/*.tar.gz
      - name: Hash distributions
        working-directory: dist
        run: sha256sum -- *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  validate:
    name: Install distributions on Python ${{ matrix.python }}
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: python -m pip install 'uv>=0.9,<1'
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Check downloaded files
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Validate standalone and RoomKit installations
        run: python scripts/check-python.py --wheel dist/roomkit_tools-*.whl --sdist dist/roomkit_tools-*.tar.gz
      - name: Validate optional OCR wheel and source installations
        run: python scripts/check-ocr-python.py --base-wheel dist/roomkit_tools-*.whl --wheel dist/roomkit_tools_ocr_rusto-*.whl --sdist dist/roomkit_tools_ocr_rusto-*.tar.gz
