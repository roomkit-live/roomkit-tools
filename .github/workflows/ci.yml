name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  python:
    name: Python ${{ matrix.python }} wheel and RoomKit adapter
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: python -m pip install 'uv>=0.9,<1'
      - run: cargo install cargo-deny --locked
      - run: make python-check
      - if: matrix.python == '3.12'
        run: make msrv-toolchain python-msrv

  checks:
    name: Format, lint, tests, examples and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: make fmt-check clippy test examples doc check-core-deps

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: make msrv-toolchain msrv

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit subjects
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$HEAD_SHA"
          else
            # An initial or rewritten history may not contain the previous tip.
            range="$HEAD_SHA"
          fi
          commits=$(git rev-list "$range")
          for commit in $commits; do
            git log -1 --format=%B "$commit" > "$RUNNER_TEMP/message"
            sh scripts/check-commit-message.sh "$RUNNER_TEMP/message" || exit 1
          done
