# roomkit-tools-core performs no I/O. Clippy reads the nearest
# clippy.toml only, so this file repeats the workspace's test allowances.

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

# Product names read as words in documentation, not as code.
doc-valid-idents = ["RoomKit", "PyO3", "WhatsApp", ".."]

disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "time belongs to tool implementations" },
    { path = "std::time::Instant::now", reason = "time belongs to tool implementations" },
    { path = "std::thread::spawn", reason = "concurrency belongs to tool implementations" },
    { path = "std::thread::sleep", reason = "waiting belongs to tool implementations" },
    { path = "std::env::var", reason = "configuration is passed in, never read from the process" },
    { path = "std::env::var_os", reason = "configuration is passed in, never read from the process" },
    { path = "std::env::vars", reason = "configuration is passed in, never read from the process" },
    { path = "std::fs::read", reason = "the core performs no I/O" },
    { path = "std::fs::read_to_string", reason = "the core performs no I/O" },
    { path = "std::fs::write", reason = "the core performs no I/O" },
    { path = "std::fs::read_dir", reason = "the core performs no I/O" },
    { path = "std::io::stdin", reason = "the core performs no I/O" },
    { path = "std::io::stdout", reason = "the core performs no I/O" },
    { path = "std::io::stderr", reason = "the core performs no I/O" },
    { path = "std::process::exit", reason = "the core returns errors, the host decides" },
]

disallowed-types = [
    { path = "std::fs::File", reason = "the core performs no I/O" },
    { path = "std::fs::OpenOptions", reason = "the core performs no I/O" },
    { path = "std::net::TcpStream", reason = "the core performs no I/O" },
    { path = "std::net::TcpListener", reason = "the core performs no I/O" },
    { path = "std::net::UdpSocket", reason = "the core performs no I/O" },
    { path = "std::process::Command", reason = "the core performs no I/O" },
    { path = "std::sync::Mutex", reason = "locks belong to tool implementations" },
    { path = "std::sync::RwLock", reason = "locks belong to tool implementations" },
]
