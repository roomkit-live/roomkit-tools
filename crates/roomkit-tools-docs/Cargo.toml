[package]
name = "roomkit-tools-docs"
description = "Selectable documentation discovery, search and reading"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["agent", "llm", "documentation", "search", "ai"]
categories = ["text-processing", "asynchronous"]

# Document `FileDocs` on docs.rs, not only the default features.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
files = ["dep:tokio", "dep:sha2"]

[dependencies]
roomkit-tools-core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio-util.workspace = true
tokio = { workspace = true, optional = true, features = ["macros", "rt", "sync"] }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true
