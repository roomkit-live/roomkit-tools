[package]
name = "roomkit-tools-search"
description = "Selectable web search backends with common typed results"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["agent", "llm", "web-search", "search", "ai"]
categories = ["web-programming::http-client", "asynchronous"]

# Document each search backend on docs.rs, not only the default features.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
exa = ["dep:reqwest", "dep:roomkit-tools-http"]
ollama = ["dep:reqwest", "dep:roomkit-tools-http"]

openai = ["dep:reqwest", "dep:roomkit-tools-http"]

[dependencies]
roomkit-tools-core.workspace = true
roomkit-tools-http = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
tokio-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util"] }

[lints]
workspace = true
