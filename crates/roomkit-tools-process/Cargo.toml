[package]
name = "roomkit-tools-process"
description = "Bounded command execution and owned persistent processes for agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["agent", "llm", "shell", "process", "ai"]
categories = ["os::unix-apis", "development-tools", "asynchronous"]

[dependencies]
roomkit-tools-core.workspace = true
futures-core.workspace = true
schemars.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "time"] }
tokio-util.workspace = true
# Private, automatically removed output files; never model-selected paths.
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
