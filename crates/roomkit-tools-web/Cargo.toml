[package]
name = "roomkit-tools-web"
description = "Bounded HTTP fetching and HTML conversion for agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["agent", "llm", "fetch", "html", "markdown"]
categories = ["web-programming::http-client", "asynchronous"]

[dependencies]
roomkit-tools-http.workspace = true
roomkit-tools-core.workspace = true
serde.workspace = true
schemars.workspace = true
reqwest.workspace = true
# Bounded HTML to Markdown and text conversion.
htmlmark.workspace = true
tokio = { workspace = true, features = ["net", "time", "rt", "macros", "sync"] }
tokio-util.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[lints]
workspace = true
