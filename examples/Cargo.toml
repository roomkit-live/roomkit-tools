[package]
name = "roomkit-tools-examples"
description = "Standalone agent tool examples that check their results"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Runnable examples and the workspace's cross-crate tests, not a library.
publish = false

[dependencies]
futures-core.workspace = true
roomkit-tools-docs = { workspace = true, features = ["files"] }
roomkit-tools-plans.workspace = true
roomkit-tools-code.workspace = true
roomkit-tools-image.workspace = true
roomkit-tools-fs.workspace = true
roomkit-tools-process.workspace = true
roomkit-tools-web.workspace = true
roomkit-tools-search = { workspace = true, features = ["exa", "ollama", "openai"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tokio-util.workspace = true

[dev-dependencies]
base64.workspace = true
roomkit-tools-core.workspace = true
# The API parity gate's defaults dump (tests/api_defaults.rs) reads every crate.
roomkit-tools-agents.workspace = true
roomkit-tools-ocr.workspace = true
roomkit-tools-ocr-rusto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }

[lints]
workspace = true

[[example]]
name = "read_file"
path = "read_file.rs"

[[example]]
name = "discover_files"
path = "discover_files.rs"

[[example]]
name = "edit_orders"
path = "edit_orders.rs"

[[example]]
name = "shell_command"
path = "shell_command.rs"

[[example]]
name = "patch_hours"
path = "patch_hours.rs"


[[example]]
name = "process_session"
path = "process_session.rs"

