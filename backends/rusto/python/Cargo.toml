[package]
name = "roomkit-tools-ocr-rusto-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
# The native module of the roomkit-tools-ocr-rusto Python package, shipped in
# its wheel.
publish = false

[workspace]
resolver = "3"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
roomkit-tools-core = { path = "../../../crates/roomkit-tools-core" }
roomkit-tools-ocr = { path = "../../../crates/roomkit-tools-ocr" }
roomkit-tools-ocr-rusto = { path = "../../../crates/roomkit-tools-ocr-rusto" }
pyo3 = { version = "0.30", features = ["abi3-py312"] }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
