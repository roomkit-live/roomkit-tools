[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "roomkit-tools-ocr-rusto"
version = "0.1.0a15"
description = "Optional RustO OCR backend for roomkit-tools"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
dependencies = ["roomkit-tools>=0.1.0a15,<0.2"]

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "python"
module-name = "roomkit_tools_ocr_rusto._native"
features = ["pyo3/extension-module"]
include = [{ path = "licenses/*.txt", format = "wheel" }]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
