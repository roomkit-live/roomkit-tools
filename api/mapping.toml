# How the Rust crates' public API maps to the Python packages', read by
# scripts/api-parity.py (`make api-parity`) against the Python snapshot in
# tests/python/ and backends/rusto/python/tests/.
#
# Python is the reference: one public API, the same names, parameters,
# defaults and behaviour (CONTRIBUTING.md, "One public API"). Only what the
# language forces may differ, and each such mapping is written here:
# - [rules]: the mappings that apply with no entry; scripts/api-parity.py's
#   docstring says what each one does. Each is a table whose `decision`
#   names where it was decided: the roomkit-rs precedent it follows (its
#   names table in docs/architecture.md, or its api/mapping.toml rules), or
#   the maintainer's decision;
# - [[map]]: the Python counterpart of a Rust item or member a rule does not
#   give, approved by the maintainer as forced by the language (`approved`,
#   a date, and `reason`; `params` renames parameters, Rust to Python).
# Any other difference needs the maintainer's decision before it is
# written. Until it is taken, it is a finding the gate fails on, unless an
# entry covers it:
# - [[exception]]: findings the maintainer approved (`approved`, `reason`);
# - [[missing]]: a feature one side has and the other lacks, recorded, not
#   ported (`approved`, `reason`), its `unmatched` or `uncompared` findings;
# - [[hidden]]: the public items #[doc(hidden)] hides from the documentation
#   (`reason`), their `hidden` findings, which no other table covers;
# - [[pending]]: findings awaiting the decision (`reason`), in the separate
#   list at the end of this file. A pending entry naming both counterparts
#   (`rust` and `python`) also pairs them, so their members are compared
#   while the name difference waits. Each decision removes its findings
#   from the list: the code changes, or an approved [[map]], [[exception]]
#   or rule replaces the entry. `make api-parity API_PARITY_FLAGS=--strict`
#   fails while one is left.
# An entry covers findings by key, `<rust|python> <path> (<kind>) [<with>]`,
# `<with>` naming what the finding was compared with when the path alone does
# not say (the other side's call or name, a struct's fields, both defaults);
# the JSON a Python call exchanges is written `json:<Type>.<property>`. A key
# no finding has, or an entry naming what is gone, is dead and fails the gate.
# Every rule and every [[map]], [[exception]], [[missing]] and [[hidden]]
# entry names in `decision` where the maintainer decided it; the gate refuses
# one without.
# A rule with no precedent and no decision yet reads "TODO: maintainer", and
# the gate fails while one is left.

[rules]
# Rust's casing of an acronym in a type's name (rust-lang RFC 430), and
# Python's.
acronyms = { Io = "IO", decision = "roomkit-rs names table: SQLiteStore(path='roomkit.db') | SqliteStore::new(SqliteStoreOptions { path }); roomkit-rs api/mapping.toml [rules] acronyms" }
# `&self` and `self` are no parameter.
receivers = { decision = "roomkit-rs names table: def m(a, b, *, k=...), a kit's call | m(&self, a, b, MOptions { k, .. })" }
# A `Result` stands for a raised exception.
results = { decision = "roomkit-rs names table: OpenAIAIProvider(config) | OpenAiAiProvider::new(config), a Result since building its HTTP client can fail" }
# Python's `async def` is an `async fn`, or a function returning a future, a
# trait object's boxed future alias (`*Future`) included.
asynchronous = { decision = "roomkit-rs names table: await kit.close() | kit.close().await, a Result; InboundRoomRouter.route(...) | InboundRoomRouter::route(...), a boxed RouterFuture" }
# Python's async factory, the constructor of a class that resolves its
# root: Python cannot await in __init__. Rust's is `new`.
factory = { method = "create", decision = "TODO: maintainer" }
# A builder, `with_<x>(self, value)`: one of a constructor's keywords, not
# calling it being Python's None.
builder_prefix = { prefix = "with_", decision = "roomkit-rs names table: RoomKit(store=SomeStore()) | RoomKitOptions::with_store(store)" }
# A struct whose name ends with one of these stands for keyword arguments:
# a struct of named fields, the Rust form of Python's keywords.
options_suffixes = { suffixes = ["Limits", "Config", "Policy", "Env"], decision = "roomkit-rs names table: RoomKit(store=None, inbound_router=None, max_chain_depth=5, ..., process_timeout=30.0) | RoomKit::new(RoomKitOptions { .. }), Python's defaults in its Default" }
# A struct whose name ends with this stands for a call's arguments: its
# fields are the Python method's parameters, `new` taking the required ones.
input_suffix = { suffix = "Input", decision = "roomkit-rs names table: def m(a, b, *, k=...), a kit's call | m(&self, a, b, MOptions { k, .. }); a pydantic model, Room(id=..., ...) | public fields of Python's names, new(<required fields>) setting Python's defaults, struct update for the rest" }
# Python's schema-shaped dict of a call's arguments, the Input struct whole.
arguments = { name = "arguments", decision = "luge-hitl:76e988fe Q4" }
# The cancellation token a Rust call takes; Python cancels the awaiting task.
cancellation = { type = "CancellationToken", decision = "TODO: maintainer" }
# A Rust type deriving JsonSchema is the JSON a Python call passes or
# returns as a dict, and has no Python class.
contract_types = { decision = "TODO: maintainer" }
# A Python property is a Rust field, or a method of `&self` alone.
properties = { decision = "roomkit-rs names table: DeliveryHandle.done (a property) | handle.done()" }
# A Rust trait is the Python class, a protocol, of its name.
traits = { decision = "roomkit-rs names table: RealtimeBackend's publish(channel, event), ... | the trait RealtimeBackend; MemoryProvider, an ABC | the trait roomkit_ai::memory::MemoryProvider" }
# An error enum is its Python base class, each variant a class of the
# family deriving from it.
error_families = { decision = "roomkit-rs names table: KitClosedError and ShutdownCancelledError, both RoomKitErrors | RoomKitError::KitClosed and RoomKitError::ShutdownCancelled, the variant of each class; roomkit-rs api/mapping.toml [rules.error_families]" }
# Rust has no optional call arguments: an Option<T> parameter stands for
# Python's `=None`, as roomkit-rs's SkillRegistry::copy(names: Option<&[String]>)
# stands for Python's copy(names=None).
optional = { type = "Option", default = "None", decision = "roomkit-rs names table: SkillRegistry::copy(names: Option<&[String]>), Rust has no optional call arguments (approved 2026-10-30)" }
# On a tool with a typed method (`ReadTool::read(input)`), Python's
# `call(arguments)` is the JSON form of that method's Input; Rust adds no
# `call` there.
typed_call = { method = "call", decision = "luge-hitl:76e988fe Q4" }
# Python's name-keyed `ProcessSession.call(name, arguments, *, owner)` and
# `definition(name)`, and OutputStore's, stand for Rust's per-tool methods
# and their `<x>_definition()` functions.
named_calls = { method = "call", key = "name", definition = "definition", suffix = "_definition", decision = "luge-hitl:76e988fe Q5" }
# A class without that factory resolves its root at first use: Python's
# synchronous __init__ (ProcessSession(root), Workspace(root),
# OutputStore(...)) stands for Rust's async new, which reports an invalid
# root earlier.
lazy_constructor = { python = "__init__", decision = "luge-hitl:76e988fe Q6" }
# A Python `None` for a Rust field that is no Option stands for the Rust
# default: Python passes no value, and the field keeps Rust's (the binding
# overrides only the values a host supplies).
deferred_default = { python = "None", decision = "TODO: maintainer" }
# Rust has no union parameter: Python's create(root | Workspace) is Rust's
# new(root) and from_workspace(workspace), an associated from_<x> building
# the type from one of `types`, which Python names too.
union_constructor = { prefix = "from_", types = ["Workspace"], decision = "luge-hitl:76e988fe Q6" }
# The RoomKit engine's tool protocol: Python's `definition` property and
# `handler` are the Rust adapter's implementation of roomkit_ai's `Tool`, the
# Rust form of that protocol. Each adapter has the name of its Python
# RoomKit tool.
tool_protocol = { trait = "Tool", members = ["definition", "handler"], decision = "roomkit-rs names table: the Tool protocol, a definition property and async handler(name, arguments) | the Tool trait, definition() -> AiTool and handler(name, arguments) -> ToolFuture; luge-hitl:588ea590 (the adapters take Python's names)" }
# The Rust types a Python builtin stands for: the envelope a call returns
# and a tool definition, which Python returns as dicts.
builtins = { "roomkit_tools_core::Output" = "dict", "roomkit_tools_core::Definition" = "dict", decision = "roomkit-rs api/mapping.toml [rules.builtins]: \"roomkit::model::Metadata\" = { python = \"dict\" }" }
# The error variants a Python builtin exception stands for, by path.
builtin_errors = { "roomkit_tools_core::ToolError::Cancelled" = "asyncio.CancelledError", decision = "roomkit-rs api/mapping.toml [rules] builtin_errors: \"roomkit::RoomKitError::Cancelled\" = \"asyncio.CancelledError\"" }

# The Python modules a Rust crate's items are looked for in, in order.
[rules.packages]
decision = "roomkit-rs api/mapping.toml [rules.packages]: the Python packages a Rust module's items are looked for in"
roomkit_tools_core = ["roomkit_tools"]
roomkit_tools_fs = ["roomkit_tools", "roomkit_tools.fs", "roomkit_tools.workspace"]
roomkit_tools_process = ["roomkit_tools", "roomkit_tools.process", "roomkit_tools.output"]
roomkit_tools_web = ["roomkit_tools", "roomkit_tools.web"]
roomkit_tools_search = ["roomkit_tools", "roomkit_tools.search"]
roomkit_tools_code = ["roomkit_tools", "roomkit_tools.code"]
roomkit_tools_image = ["roomkit_tools", "roomkit_tools.image"]
roomkit_tools_ocr = ["roomkit_tools", "roomkit_tools.ocr"]
roomkit_tools_ocr_rusto = ["roomkit_tools_ocr_rusto"]
roomkit_tools_docs = ["roomkit_tools", "roomkit_tools.docs"]
roomkit_tools_plans = ["roomkit_tools", "roomkit_tools.plans"]
roomkit_tools_agents = ["roomkit_tools", "roomkit_tools.agents"]
roomkit_tools_roomkit = ["roomkit_tools.roomkit", "roomkit_tools"]

# ---------------------------------------------------------------------------
# APPROVED: the differences the maintainer approved, with their source.
# ---------------------------------------------------------------------------

[[map]]
rust = "roomkit_tools_ocr_rusto::RustoOcr::lazy"
python = "roomkit_tools_ocr_rusto.RustoOcr.__init__"
approved = 2026-11-02
decision = "luge-hitl:76e988fe Q7"
reason = "the OCR backend protocol differs for this release: Rust builds the lazy engine with RustoOcr::lazy(RustoConfig), Python's RustoOcr(models, ...) is the backend itself; the configuration is the same"

[[exception]]
approved = 2026-11-02
decision = "luge-hitl:76e988fe Q7"
reason = "for this release, the OCR backend protocol differs: Python's OcrBackend.bind(root, limits) returns a BoundOcrBackend whose call(arguments) runs the tool; Rust's OcrBackend has identity() and recognize(&DecodedImage), wrapped in an OcrEngine that RustoOcr::lazy and load build. The OcrTool surface and the tool contract are the same; Python will adopt Rust's recognizer model later"
covers = [
  "python roomkit_tools.OcrBackend.bind (unmatched)",
  "python roomkit_tools.ocr.BoundOcrBackend (unmatched)",
  "python roomkit_tools_ocr_rusto.RustoOcr.bind (unmatched)",
  "rust roomkit_tools_ocr::OcrBackend::identity (unmatched)",
  "rust roomkit_tools_ocr::OcrBackend::recognize (unmatched)",
  "rust roomkit_tools_ocr::OcrEngine (unmatched)",
  "rust roomkit_tools_ocr::DecodedImage (unmatched)",  # the image the Rust trait recognizes, kept public for backends
  "rust roomkit_tools_image::DecodedImage (unmatched)",  # the same type, re-exported by roomkit_tools_ocr
  "rust roomkit_tools_ocr_rusto::RustoOcr::lazy (result)",
  "rust roomkit_tools_ocr_rusto::RustoOcr::load (unmatched)",
]

[[exception]]
approved = 2026-11-02
decision = "luge-hitl:76e988fe Q9"
reason = "forced by the language: ForkedProcessError is Python's guard against using the native extension in a child forked after the parent used it; a Rust host has no such interpreter state"
covers = [
  "python roomkit_tools.ForkedProcessError (unmatched)",
]

