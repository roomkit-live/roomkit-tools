[[hidden]]
decision = "luge-hitl:76e988fe A11"
reason = "the plumbing the tool crates and the bindings share, which Python has no name for and a host never needs: core's envelope constructors, workspace path rules, identifier order and revision spelling; the contract traits with their decode and render; the scopes' and the command environment's validate; the image crate's workspace and decoder"
covers = [
  "rust roomkit_tools_core::Definition::new (hidden)",
  "rust roomkit_tools_core::Output::new (hidden)",
  "rust roomkit_tools_core::WorkspaceRoot (hidden)",
  "rust roomkit_tools_core::identifiers::creation_order (hidden)",
  "rust roomkit_tools_core::revision::sha256 (hidden)",
  "rust roomkit_tools_process::CommandEnv::validate (hidden)",
  "rust roomkit_tools_image::ImageWorkspace (hidden)",
  "rust roomkit_tools_image::decode_rgb (hidden)",
  "rust roomkit_tools_docs::DocsContract (hidden)",
  "rust roomkit_tools_docs::decode (hidden)",
  "rust roomkit_tools_docs::render (hidden)",
  "rust roomkit_tools_plans::PlanContract (hidden)",
  "rust roomkit_tools_plans::PlanScope::validate (hidden)",
  "rust roomkit_tools_plans::decode (hidden)",
  "rust roomkit_tools_plans::render (hidden)",
  "rust roomkit_tools_agents::AgentContract (hidden)",
  "rust roomkit_tools_agents::AgentScope::validate (hidden)",
  "rust roomkit_tools_agents::decode (hidden)",
  "rust roomkit_tools_agents::render (hidden)",
]

