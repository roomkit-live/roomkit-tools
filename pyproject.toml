[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "roomkit-tools"
version = "0.1.0a13.dev0"
description = "Individually selectable Rust tools with an asynchronous Python API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/roomkit-live/roomkit-tools"
Issues = "https://github.com/roomkit-live/roomkit-tools/issues"

[project.optional-dependencies]
roomkit = ["roomkit>=0.110,<0.112"]

[tool.maturin]
manifest-path = "bindings/python/Cargo.toml"
python-source = "python"
module-name = "roomkit_tools._native"
features = ["pyo3/extension-module"]
exclude = ["docs/**", "AGENTS.md", "integrations/**", "scripts/roomkit-bakery.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["python/**/*.py", "tests/python/**/*.py", "examples/*.py", "scripts/check-python.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
