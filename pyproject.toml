[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "roomkit-tools"
version = "0.1.0a17.dev0"
description = "Composable Rust tools for coding agents, Python and RoomKit"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "python/roomkit_tools/licenses/native_dependencies.txt"]
keywords = ["agents", "tools", "rust", "asyncio", "roomkit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://github.com/roomkit-live/roomkit-tools/blob/main/guide/README.md"
Changelog = "https://github.com/roomkit-live/roomkit-tools/blob/main/CHANGELOG.md"
Repository = "https://github.com/roomkit-live/roomkit-tools"
Issues = "https://github.com/roomkit-live/roomkit-tools/issues"

[project.optional-dependencies]
roomkit = ["roomkit>=0.110,<0.112"]

[tool.maturin]
manifest-path = "bindings/python/Cargo.toml"
python-source = "python"
module-name = "roomkit_tools._native"
features = ["pyo3/extension-module"]
exclude = ["docs/**", "AGENTS.md"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["python/**/*.py", "tests/python/**/*.py", "examples/*.py", "scripts/check-python.py", "scripts/check-ocr-python.py", "scripts/native-notices.py", "scripts/artifact_files.py", "scripts/api-parity.py", "scripts/api-snapshot.py", "scripts/api_parity/*.py", "scripts/tests/test_api_parity.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
