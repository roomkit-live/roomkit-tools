[package]
name = "roomkit-tools-python"
description = "Optional Python bindings for independent Rust agent tools"
version = "0.1.0-alpha.16"
edition = "2024"
rust-version = "1.94"
license = "MIT"
# The native module of the roomkit-tools Python package, shipped in its wheel.
publish = false

# The standalone Rust workspace must not require a Python interpreter or bridge.
[workspace]
resolver = "3"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
roomkit-tools-docs = { version = "0.1.0-alpha.16", path = "../../crates/roomkit-tools-docs", features = ["files"] }
roomkit-tools-plans = { version = "0.1.0-alpha.16", path = "../../crates/roomkit-tools-plans" }
roomkit-tools-ocr = { version = "0.1.0-alpha.16", path = "../../crates/roomkit-tools-ocr" }
roomkit-tools-agents = { version = "0.1.0-alpha.16", path = "../../crates/roomkit-tools-agents" }
roomkit-tools-code = { version = "0.1.0-alpha.16", path = "../../crates/roomkit-tools-code" }
roomkit-tools-image = { version = "0.1.0-alpha.16", path = "../../crates/roomkit-tools-image" }
roomkit-tools-search = { version = "0.1.0-alpha.16", path = "../../crates/roomkit-tools-search", features = ["exa", "ollama", "openai"] }
roomkit-tools-core = { version = "0.1.0-alpha.16", path = "../../crates/roomkit-tools-core" }
roomkit-tools-fs = { version = "0.1.0-alpha.16", path = "../../crates/roomkit-tools-fs" }
# Foreground shell execution and process-group cleanup remain in Rust.
roomkit-tools-process = { version = "0.1.0-alpha.16", path = "../../crates/roomkit-tools-process" }
roomkit-tools-web = { version = "0.1.0-alpha.16", path = "../../crates/roomkit-tools-web" }
# Stable CPython ABI, with a separate Tokio/asyncio bridge for awaitable I/O.
pyo3 = { version = "0.30", features = ["abi3-py312"] }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# One shared lazy mutation scope, independent of Python event-loop lifetimes.
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
# Reads a session's job ends, a Rust `Stream`; the JSON schema of their
# contract type, which no tool contract holds, for the API snapshot.
futures-core = { version = "0.3", default-features = false }
schemars = "1.2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
