[workspace]
resolver = "3"
members = ["crates/*", "examples"]
exclude = ["adapters/roomkit", "bindings/python"]

[workspace.package]
version = "0.1.0-alpha.16"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/roomkit-live/roomkit-tools"

[workspace.dependencies]
roomkit-tools-docs = { version = "0.1.0-alpha.16", path = "crates/roomkit-tools-docs", default-features = false }
roomkit-tools-plans = { version = "0.1.0-alpha.16", path = "crates/roomkit-tools-plans" }
roomkit-tools-agents = { version = "0.1.0-alpha.16", path = "crates/roomkit-tools-agents" }
roomkit-tools-core = { version = "0.1.0-alpha.16", path = "crates/roomkit-tools-core" }
roomkit-tools-code = { version = "0.1.0-alpha.16", path = "crates/roomkit-tools-code" }
roomkit-tools-image = { version = "0.1.0-alpha.16", path = "crates/roomkit-tools-image" }
roomkit-tools-ocr = { version = "0.1.0-alpha.16", path = "crates/roomkit-tools-ocr" }
roomkit-tools-ocr-rusto = { version = "0.1.0-alpha.16", path = "crates/roomkit-tools-ocr-rusto" }
rusto-rs = { version = "0.3.2", default-features = false }
rten = { version = "0.27", default-features = false, features = ["onnx_format", "rten_format"] }
rten-tensor = "0.27"
ndarray = "0.16"
rayon = "1"
roomkit-tools-fs = { version = "0.1.0-alpha.16", path = "crates/roomkit-tools-fs" }
roomkit-tools-process = { version = "0.1.0-alpha.16", path = "crates/roomkit-tools-process" }
roomkit-tools-web = { version = "0.1.0-alpha.16", path = "crates/roomkit-tools-web" }
# Bounded HTML to Markdown and text conversion: github.com/sboily/htmlmark.
htmlmark = "0.1"
roomkit-tools-http = { version = "0.1.0-alpha.16", path = "crates/roomkit-tools-http" }
roomkit-tools-search = { version = "0.1.0-alpha.16", path = "crates/roomkit-tools-search", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
globset = "0.4"
regex = "1"
# Content revisions for optimistic filesystem mutations; never in core.
sha2 = "0.11"
# Local image preparation only; no codecs or image I/O in core or fs.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.23"
# Optional source outlines: parser and two grammars stay in the code crate.
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
thiserror = "2"
# Runtime dependencies belong to the tools, never the contracts crate.
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
# Atomic staged writes in filesystem tools; also test/example fixtures.
tempfile = "3"
# Unix sessions and process-group signals. The only unsafe code is the
# `setsid` call between fork and exec in roomkit-tools-process.
rustix = { version = "1", features = ["process"] }
# Independent HTTP fetching and HTML conversion; never in core.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "gzip"] }
# TLS for reqwest: ring and the bundled Mozilla roots, the same on every host,
# including containers without a system certificate store.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
url = "2"

[workspace.lints.rust]
# The single exception is `new_session` in crates/roomkit-tools-process/src/unix.rs
# (`setsid` between fork and exec), allowed on that function only. Every other
# library crate root, every example target and every other module of the
# process crate forbids unsafe code; integration tests deny it.
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Module paths already name the domain (`hook_chain::Outcome` reads better than
# `hook_chain::HookChainOutcome`), and `#[must_use]` is put where ignoring a
# value is a bug rather than on every pure function.
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Library code never panics on input: no unwrap, expect, panic, indexing or
# string slicing outside tests (clippy.toml allows them in tests).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
string_slice = "warn"
todo = "warn"
unimplemented = "warn"
# Output goes through `tracing`; examples opt out explicitly.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
# A silenced lint states why, and `expect` fails once the reason is gone.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Adding a variant to a closed enumeration must force every match to decide.
wildcard_enum_match_arm = "warn"
clone_on_ref_ptr = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
bare_urls = "warn"
