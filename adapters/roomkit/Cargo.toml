[package]
name = "roomkit-tools-roomkit"
description = "Select individual roomkit-tools through RoomKit Rust's Toolset interface"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

# Optional integration workspace. Pin the same engine revision as consuming
# hosts so this adapter works from Git without a sibling engine checkout.
[workspace]
resolver = "3"

[features]
default = []
docs = ["dep:roomkit-tools-docs"]
plans = ["dep:roomkit-tools-plans"]
ocr = ["dep:roomkit-tools-ocr"]

[dependencies]
roomkit-tools-docs = { path = "../../crates/roomkit-tools-docs", optional = true }
roomkit-tools-plans = { path = "../../crates/roomkit-tools-plans", optional = true }
roomkit-tools-ocr = { path = "../../crates/roomkit-tools-ocr", optional = true }
roomkit-tools-code = { path = "../../crates/roomkit-tools-code" }
roomkit-tools-search = { path = "../../crates/roomkit-tools-search" }
roomkit-tools-web = { path = "../../crates/roomkit-tools-web" }
roomkit = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "79ca5058d27fc889d77ba3b17b24360ab6182f72" }
roomkit-ai = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "79ca5058d27fc889d77ba3b17b24360ab6182f72" }
roomkit-tools-core = { path = "../../crates/roomkit-tools-core" }
roomkit-tools-fs = { path = "../../crates/roomkit-tools-fs" }
roomkit-tools-process = { path = "../../crates/roomkit-tools-process" }
serde_json = "1"
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }

[dev-dependencies]
roomkit-tools-docs = { path = "../../crates/roomkit-tools-docs", features = ["files"] }
roomkit-tools-search = { path = "../../crates/roomkit-tools-search", features = ["openai"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "net", "io-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
allow_attributes = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
