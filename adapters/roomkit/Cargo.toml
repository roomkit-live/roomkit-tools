[package]
name = "roomkit-tools-roomkit"
description = "Select individual roomkit-tools as RoomKit Rust tools"
version = "0.1.0-alpha.16"
edition = "2024"
rust-version = "1.94"
license = "MIT"
# Not on crates.io: it depends on roomkit-rs by git, which crates.io refuses,
# and the crates.io name `roomkit` belongs to an unrelated project.
publish = false

# Optional integration workspace. Pin the same engine revision as consuming
# hosts so this adapter works from Git without a sibling engine checkout.
[workspace]
resolver = "3"

[features]
default = []
docs = ["dep:roomkit-tools-docs"]
plans = ["dep:roomkit-tools-plans"]
ocr = ["dep:roomkit-tools-ocr"]
image = ["dep:roomkit-tools-image"]

[dependencies]
roomkit-tools-docs = { version = "0.1.0-alpha.16", path = "../../crates/roomkit-tools-docs", optional = true }
roomkit-tools-plans = { version = "0.1.0-alpha.16", path = "../../crates/roomkit-tools-plans", optional = true }
roomkit-tools-ocr = { version = "0.1.0-alpha.16", path = "../../crates/roomkit-tools-ocr", optional = true }
roomkit-tools-image = { version = "0.1.0-alpha.16", path = "../../crates/roomkit-tools-image", optional = true }
roomkit-tools-code = { version = "0.1.0-alpha.16", path = "../../crates/roomkit-tools-code" }
roomkit-tools-search = { version = "0.1.0-alpha.16", path = "../../crates/roomkit-tools-search" }
roomkit-tools-web = { version = "0.1.0-alpha.16", path = "../../crates/roomkit-tools-web" }
roomkit = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "dcaf5053a894b814e7f4a5e11e935e8ff87a0283" }
roomkit-ai = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "dcaf5053a894b814e7f4a5e11e935e8ff87a0283" }
roomkit-tools-core = { version = "0.1.0-alpha.16", path = "../../crates/roomkit-tools-core" }
roomkit-tools-fs = { version = "0.1.0-alpha.16", path = "../../crates/roomkit-tools-fs" }
roomkit-tools-process = { version = "0.1.0-alpha.16", path = "../../crates/roomkit-tools-process" }
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }

[dev-dependencies]
base64 = "0.23"
roomkit-tools-docs = { version = "0.1.0-alpha.16", path = "../../crates/roomkit-tools-docs", features = ["files"] }
roomkit-tools-search = { version = "0.1.0-alpha.16", path = "../../crates/roomkit-tools-search", features = ["openai"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "net", "io-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
allow_attributes = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
